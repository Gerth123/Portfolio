<section id="landingPage" class="hero-section section-shell">
  <div class="container-xxl">
    <div class="row align-items-center g-4 g-lg-5 hero-layout">
      <div class="col-lg-6 order-lg-1">
        <div class="hero-visual-stage mx-auto">
          <img
            src="../../assets/img/29. photo shadows.svg"
            alt=""
            class="hero-shadow"
            aria-hidden="true"
          />
          <img
            src="../../assets/img/lurdwig.png"
            alt="Robin Gerth"
            class="hero-profile"
            #heroProfile
          />
        </div>
      </div>

      <div class="col-lg-6 order-lg-2">
        <div class="hero-content" #heroTextGroup>
          <span
            class="hero-intro"
            #heroSideLabel
            [ngClass]="{
              'hero-intro--en': getCurrentLanguage() === 'en',
              'hero-intro--de': getCurrentLanguage() === 'de'
            }"
            >{{ getCurrentText("rotateText") }}</span
          >
          <div class="hero-heading" #heroTitleStack>
            <h1 #heroName>Robin Gerth</h1>
            <p class="hero-role" #heroRole>{{ getCurrentText("subtitle") }}</p>
          </div>

          <div class="hero-actions">
            <a
              [routerLink]="['/', getCurrentLanguage()]"
              [fragment]="'contact'"
              class="btn btn-portfolio hero-button"
              (click)="handleScroll('contact')"
              >{{ getCurrentText("buttonText") }}</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="hero-footer d-flex align-items-center justify-content-between gap-4">
      <div class="d-flex align-items-center gap-3">
        <span class="accent-line accent-line--to-left"></span>
        <div class="social-links d-flex align-items-center gap-3">
          <a href="https://github.com/Gerth123" target="_blank" rel="noreferrer" aria-label="Github">
            <img src="../../assets/icons/github_small_button.svg" alt="" />
          </a>
          <a href="mailto:kontakt@robin-gerth.de" aria-label="Email">
            <img src="../../assets/icons/email_small_button.svg" alt="" />
          </a>
          <a
            href="https://linkedin.com/in/robin-gerth-47100031b/"
            target="_blank"
            rel="noreferrer"
            aria-label="LinkedIn"
          >
            <img src="../../assets/icons/linkedin_small_button.svg" alt="" />
          </a>
        </div>
        <a href="mailto:kontakt@robin-gerth.de" class="hero-footer-mail">
          kontakt&#64;robin-gerth.de
        </a>
      </div>
      <div class="scroll-hint d-none d-lg-flex align-items-center gap-2">
        <span>Scroll down</span>
        <img src="../../assets/icons/right-arrow.png" alt="" />
      </div>
    </div>
  </div>

  <img
    src="../../assets/img/background_under_profile_picture.svg"
    alt=""
    class="hero-wave"
    #heroWave
    aria-hidden="true"
  />
</section>
