<section id="aboutMe" class="about-section section-shell">
  <div class="container-xxl">
    <div class="row align-items-center g-5">
      <div class="col-lg-7" data-aos="fade-up">
        <div class="d-flex align-items-center gap-3 mb-4">
          <span class="accent-line accent-line--to-left"></span>
          <h2 class="section-title">{{ getCurrentText("headline") }}</h2>
        </div>
        <p class="section-copy lead mt-4">{{ getCurrentText("shortDescription") }}</p>
        <p class="section-copy mt-3">{{ getCurrentText("consultingNote") }}</p>

        <div class="row g-3 mt-4">
          <div class="col-md-4" *ngFor="let signal of workSignals">
            <article class="metric-card portfolio-card portfolio-card--quiet h-100">
              <strong>{{ getSignalValue(signal) }}</strong>
              <span>{{ getSignalLabel(signal) }}</span>
            </article>
          </div>
        </div>

        <div class="row g-3 mt-3">
          <div class="col-md-6 col-xl-4">
            <article class="about-point portfolio-card card h-100">
              <div class="card-body">
                <img src="../../assets/icons/location.svg" alt="" />
                <p>{{ getCurrentText("location") }}</p>
              </div>
            </article>
          </div>
          <div class="col-md-6 col-xl-4">
            <article class="about-point portfolio-card card h-100">
              <div class="card-body">
                <img src="../../assets/icons/light_bulb.svg" alt="" />
                <p>{{ getCurrentText("interest") }}</p>
              </div>
            </article>
          </div>
          <div class="col-md-12 col-xl-4">
            <article class="about-point portfolio-card card h-100">
              <div class="card-body">
                <img src="../../assets/icons/puzzle.svg" alt="" />
                <p>{{ getCurrentText("puzzle") }}</p>
              </div>
            </article>
          </div>
        </div>
      </div>

      <div class="col-lg-5 d-none d-lg-block">
        <div class="profileImageContainer" data-aos="fade-up">
          <div class="profileImage">
            <img src="../../assets/img/file_new.png" alt="Robin Gerth profile picture" />
          </div>
          <span class="profile-line" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </div>
</section>
