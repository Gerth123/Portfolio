<section id="projects" class="projects-section section-shell">
  <div class="container-xxl">
    <div class="row justify-content-center text-center">
      <div class="col-lg-9">
        <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
          <span class="accent-line accent-line--to-left"></span>
          <h2 class="section-title">Portfolio</h2>
          <span class="accent-line accent-line--to-right"></span>
        </div>
        <p class="section-copy lead">{{ getCurrentText("firstSpan") }}</p>
      </div>
    </div>

    <div class="projectsContainer d-grid gap-4 gap-lg-5 mt-5">
      <article
        *ngFor="let project of caseStudies"
        class="project-card portfolio-card card"
        data-aos="fade-up"
      >
        <div class="row g-0 align-items-stretch">
          <div class="col-lg-6" [ngClass]="{ 'order-lg-2': !project.reverse }">
            <div class="project-media" [ngClass]="project.mediaClass">
              <img
                *ngIf="project.image"
                [src]="project.image"
                [alt]="project.imageAlt"
                [ngClass]="project.imageClass"
              />

              <div *ngIf="project.visualType === 'ai'" class="ai-workflow-visual" aria-hidden="true">
                <img src="../../assets/icons/ai_assisted_coding.svg" alt="" />
                <img src="../../assets/icons/ki_workflows.svg" alt="" />
                <img src="../../assets/icons/automations.svg" alt="" />
                <span>RAG</span>
              </div>
            </div>
          </div>

          <div class="col-lg-6" [ngClass]="{ 'order-lg-1': !project.reverse }">
            <div
              class="projectText card-body"
              [ngClass]="{
                'text-lg-end align-items-lg-end': project.reverse,
                'align-items-lg-start': !project.reverse
              }"
            >
              <span class="portfolio-eyebrow">{{ getCurrentText("caseStudy") }} · {{ project.kicker[getCurrentLanguage()] }}</span>
              <h3>{{ project.title }}</h3>

              <div class="d-flex flex-wrap gap-2" [ngClass]="{ 'justify-content-lg-end': project.reverse }">
                <span class="tech-pill" *ngFor="let tech of project.stack">{{ tech }}</span>
              </div>

              <p class="section-copy">{{ project.text[getCurrentLanguage()] }}</p>

              <ul class="project-focus">
                <li *ngFor="let item of project.focus[getCurrentLanguage()]">{{ item }}</li>
              </ul>

              <div
                class="d-flex flex-wrap gap-3"
                [ngClass]="{ 'justify-content-lg-end': project.reverse }"
                *ngIf="project.liveHref || project.codeHref"
              >
                <a
                  *ngIf="project.liveHref"
                  [href]="project.liveHref"
                  class="btn btn-portfolio project-button"
                  target="_blank"
                  rel="noreferrer"
                  >{{ getCurrentText("liveTest") }}</a
                >
                <a
                  *ngIf="project.codeHref"
                  [href]="project.codeHref"
                  class="btn btn-outline-portfolio project-button"
                  target="_blank"
                  rel="noreferrer"
                  >{{ project.codeLabel }}</a
                >
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
